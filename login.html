<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskBox - Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <!-- بک‌گراند تار -->
  <div class="bg-layer">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="bg-shape shape-4"></div>
    <div class="bg-shape shape-5"></div>
  </div>

  <!-- باکس اصلی لاگین -->
  <div class="login-container">
    <h1>TaskBox</h1>
    <p class="subtitle">Welcome back! Please login to continue.</p>

    <!-- تب‌ها -->
    <div class="tabs">
      <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">Login</button>
      <button class="tab-btn" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <!-- فرم لاگین -->
    <form id="loginForm" class="form active">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <input type="text" id="loginUsername" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="submit-btn">Login</button>
      <p id="loginError" class="error-message"></p>
    </form>

    <!-- فرم ثبت‌نام -->
    <form id="signupForm" class="form">
      <div class="form-group">
        <label for="signupUsername">Username</label>
        <input type="text" id="signupUsername" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="Choose a password (min 4 chars)" required>
      </div>
      <div class="form-group">
        <label for="signupConfirm">Confirm Password</label>
        <input type="password" id="signupConfirm" placeholder="Confirm your password" required>
      </div>
      <button type="submit" class="submit-btn">Sign Up</button>
      <p id="signupError" class="error-message"></p>
      <p id="signupSuccess" class="success-message"></p>
    </form>
  </div>

  <script src="login.js"></script>
</body>
</html>
